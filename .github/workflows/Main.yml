name: Main
# ARK-81 bench: upstream Main.yml cut to its main test jobs, runs-on swapped to outrun-linux-arm64 (ARM64) and
# outrun-macos. Kept: prepare, Linux Relassert (build), Linux Relassert Tests, osx (OSX Debug, OSX Release).
# The two Linux jobs run in upstream's manylinux aarch64 image instead of the amd64 one (same image, other arch).
# Dropped: Windows, every x64-only job and the ~90 other jobs (extensions, regression, configs, sanitizers...).
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format('Main ({0})', inputs.duckdb_version || format('alpha{0}', github.run_number)) ||
    ''
  }}
on:
  workflow_dispatch:
    inputs:
      duckdb_version:
        type: string
      duckdb_commit:
        type: string
      skip_tests:
        type: boolean
        default: false
      run_all:
        type: boolean
        default: true
      cache:
        description: outrun's cache namespace (ARK-81 bench; a fresh one is a cold cache)
        type: string
        default: outrun
      extension_exclude_archs:
        description: 'Extra extension archs to skip, separated by ";" (e.g. windows_amd64)'
        type: string
        default: ''
  # ARK-81 engine bench: dispatched only (no push/pull_request runs).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/v')) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  OUTRUN_CACHE_URL: https://turbo-cache.arkadia.so
  OUTRUN_CACHE_TEAM: ${{ inputs.cache || 'outrun' }}
  # Override extension CI matrix reduction with "enabled" or "disabled".
  # Use "disabled" on risky PRs to run the full extension matrix.
  # OVERRIDE_REDUCED_CI_MODE: disabled
  # Run only specific jobs in CI (separated by whitespace) and skip the rest.
  #
  # Add the CI job's `needs:` list here as well. Otherwise, those are skipped
  # and the dependent job is also skipped.
  #
  # For example, to build and deploy extensions, use:
  # OVERRIDE_JOBS: linux-relassert linux-release linux-release-musl windows extensions-build extensions-deploy
  # Add "osx" when running the full extension matrix.

jobs:
 prepare:
    # We run all other jobs on PRs only if they are not draft PR
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event.action != 'synchronize' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: outrun-linux-arm64
    outputs:
      duckdb_commit: ${{ steps.version.outputs.duckdb_commit }}
      runner_linux_slim: ${{ fromJSON(steps.config.outputs.runners).linux_slim }}
      runner_linux_small: ${{ fromJSON(steps.config.outputs.runners).linux_small }}
      runner_linux_x64: ${{ fromJSON(steps.config.outputs.runners).linux_x64 }}
      runner_linux_22_x64: ${{ fromJSON(steps.config.outputs.runners).linux_22_x64 }}
      runner_linux_arm64: ${{ fromJSON(steps.config.outputs.runners).linux_arm64 }}
      runner_windows_2022_x64: ${{ fromJSON(steps.config.outputs.runners).windows_2022_x64 }}
      runner_macos_arm64: ${{ fromJSON(steps.config.outputs.runners).macos_arm64 }}
      runner_macos_14_arm64: ${{ fromJSON(steps.config.outputs.runners).macos_14_arm64 }}
      runners: ${{ steps.config.outputs.runners }}
      images: ${{ steps.config.outputs.images }}
      image_version: ${{ steps.config.outputs.image_version }}
      linux_release_matrix: ${{ steps.config.outputs.linux_release_matrix }}
      linux_musl_matrix: ${{ steps.config.outputs.linux_musl_matrix }}
      extensions_changed: ${{ steps.changed.outputs.extensions_any_changed }}
      extension_opt_in_archs: ${{ steps.config.outputs.extension_opt_in_archs }}
      changed_tests_files: ${{ steps.changed.outputs.tests_all_changed_files }}
      changed_slow_tests_files: ${{ steps.changed.outputs.tests_slow_all_changed_files }}
      run_slow_tests: ${{ steps.config.outputs.run_slow_tests }}
      extensions_extra_exclude_archs: ${{ steps.config.outputs.extra_exclude_archs }}
      enabled_jobs: ${{ steps.config.outputs.enabled_jobs }}
      save_cache: ${{ steps.config.outputs.save_cache }}
      reduced_ci_mode: ${{ steps.config.outputs.reduced_ci_mode }}
      windows_full_matrix: ${{ steps.config.outputs.windows_full_matrix }}
      runner_provider: ${{ steps.runners.outputs.runner_provider }}
      skip_tests: ${{ steps.config.outputs.skip_tests }}
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
      is_release_build: ${{ steps.version.outputs.is_release_build }}
      staged_version: ${{ steps.version.outputs.staged_version }}
      extension_allow_failure_archs: ${{ steps.version.outputs.extension_allow_failure_archs }}
    env:
      GEN: ninja
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

      - name: Resolve DuckDB commit
        id: resolve_duckdb_commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.duckdb_commit }}" ]]; then
            resolved_commit="$(gh api -X GET "/repos/${{ github.repository }}/commits" -f sha="${{ inputs.duckdb_commit }}" -f per_page=1 --jq '.[0].sha')"
          else
            resolved_commit="${{ github.sha }}"
          fi
          echo "duckdb_commit=$resolved_commit" >> "$GITHUB_OUTPUT"
          echo "Using duckdb_commit=$resolved_commit"

      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ steps.runners.outputs.runner_provider }}
          fetch_depth: 0
          ref: ${{ steps.resolve_duckdb_commit.outputs.duckdb_commit }}

      - name: Resolve DuckDB version
        id: version
        shell: bash
        env:
          RESOLVED_COMMIT: ${{ steps.resolve_duckdb_commit.outputs.duckdb_commit }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.duckdb_version || '' }}
        run: |
          alpha_args=()
          staged_version=""
          extension_allow_failure_archs=
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ inputs.duckdb_commit }}" && -z "$INPUT_VERSION" ]]; then
            alpha_args=(--alpha-run-number "${{ github.run_number }}")
            extension_allow_failure_archs="windows_arm64;osx_amd64;windows_amd64_mingw;linux_amd64_musl;linux_arm64_musl"
          fi
          version_output="$(python3 scripts/ci/version.py \
            --duckdb-commit "$RESOLVED_COMMIT" \
            --duckdb-version "$INPUT_VERSION" \
            "${alpha_args[@]}" \
            --github-output)"
          printf '%s\n' "$version_output" >> "$GITHUB_OUTPUT"
          duckdb_version="$(sed -n 's/^duckdb_version=//p' <<<"$version_output")"
          if [[ ${#alpha_args[@]} -gt 0 ]]; then
            staged_version="${RESOLVED_COMMIT:0:10}/$duckdb_version"
          fi
          {
            echo "staged_version=$staged_version"
            echo "extension_allow_failure_archs=$extension_allow_failure_archs"
          } >> "$GITHUB_OUTPUT"
          echo "Using duckdb_commit=$RESOLVED_COMMIT"
          echo "Using duckdb_version=$duckdb_version"
          echo "Using staged_version=$staged_version"
          echo "Using extension_allow_failure_archs=$extension_allow_failure_archs"

      - name: Detect changes
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          separator: "\n"
          safe_output: false
          write_output_files: true
          output_dir: .github/outputs
          files_yaml: |
            github:
              - .github/**
            osx:
              - '.github/workflows/OSX.yml'
              - scripts/lldb/**
              - tools/swift/**
            extensions:
              - .github/config/**
              - .github/patches/**
            tests:
              - test/**/*.test
            tests_slow:
              - test/**/*.cpp
              - test/**/*.test_slow
            format:
              - CMakeLists.txt
              - src/**
              - benchmark/**
              - test/**
              - tools/**
              - examples/**
              - extension/**
              - scripts/**

      # ARK-81 bench: outrun's Linux image has no shellcheck (GitHub's has it); Lint CI runs because .github changed.
      - name: 'outrun: install shellcheck'
        if: steps.changed.outputs.github_any_changed == 'true'
        run: command -v shellcheck || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)

      - name: Lint CI
        if: steps.changed.outputs.github_any_changed == 'true'
        timeout-minutes: 10
        uses: duckdb/duckdb-ci/lint-ci@main

      - name: Configure CI
        id: config
        shell: bash
        env:
          CHANGED_KEYS: ${{ steps.changed.outputs.changed_keys }}
          INPUT_EXCLUDE_ARCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.extension_exclude_archs || '' }}
        run: |
          skip_tests="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests || 'false' }}"
          python3 scripts/ci/job_stages.py \
            --event "${{ github.event_name }}" \
            --ref_name "${{ github.ref_name }}" \
            --default_branch "${{ github.event.repository.default_branch }}" \
            --repository "${{ github.repository }}" \
            --skip-tests "$skip_tests" \
            --changed-keys "$CHANGED_KEYS" \
            --reduced-ci-mode "${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.run_all)) && 'enabled' || 'disabled' }}" \
            --run-all "${{ github.event_name != 'workflow_dispatch' || inputs.run_all }}" \
            --runners '${{ steps.runners.outputs.runners }}' \
            --runner-provider '${{ steps.runners.outputs.runner_provider }}'

          # Wasm extensions: wasm_eh everywhere, wasm_threads only on dispatched (nightly) runs, never wasm_mvp
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            wasm_exclude_archs="wasm_mvp"
          else
            wasm_exclude_archs="wasm_mvp;wasm_threads"
          fi
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            extra_exclude_archs="$wasm_exclude_archs"
          elif [[ "${{ steps.changed.outputs.extensions_any_changed }}" == "true" ]]; then
            extra_exclude_archs="$wasm_exclude_archs;osx_amd64"
          else
            extra_exclude_archs="$wasm_exclude_archs;windows_arm64;osx_amd64;wasm_eh"
          fi
          if [[ -n "$INPUT_EXCLUDE_ARCHS" ]]; then
            extra_exclude_archs="${extra_exclude_archs:+$extra_exclude_archs;}$INPUT_EXCLUDE_ARCHS"
          fi

          echo "extra_exclude_archs=$extra_exclude_archs" >> "$GITHUB_OUTPUT"

          if [[ "${{ steps.changed.outputs.tests_slow_any_changed }}" == "true" || "${{ steps.version.outputs.is_release_build }}" == "true" ]]; then
            run_slow_tests=true
          else
            run_slow_tests=false
          fi
          echo "run_slow_tests=$run_slow_tests" >> "$GITHUB_OUTPUT"
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"

          image_version="$(<scripts/ci/image_version.txt)"

          images=$(
            jq -nc --arg image_version "$image_version" \
              '{
                manylinux_amd64_main: ("ghcr.io/duckdb/duckdb-ci/manylinux_2_28_amd64_main:" + $image_version),
                manylinux_arm64_main: ("ghcr.io/duckdb/duckdb-ci/manylinux_2_28_aarch64_main:" + $image_version),
                alpine_amd64_main: ("ghcr.io/duckdb/duckdb-ci/alpine_3_22_amd64_main:" + $image_version),
                alpine_arm64_main: ("ghcr.io/duckdb/duckdb-ci/alpine_3_22_aarch64_main:" + $image_version),
                ubuntu_24_04_amd64_compat: ("ghcr.io/duckdb/duckdb-ci/ubuntu_24_04_amd64_compat:" + $image_version),
                ubuntu_24_04_amd64_lint: ("ghcr.io/duckdb/duckdb-ci/ubuntu_24_04_amd64_lint:" + $image_version)
              }'
          )

          grep -E '^(extra_exclude_archs|runner_)' "$GITHUB_OUTPUT"
          {
            echo "image_version=$image_version"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ARK-81 bench: skipped. Its format check pins clang_format==11.0.1, which has no aarch64 wheel and builds
      # LLVM from source (needs cmake, absent from outrun's image). These are lint checks, not the tests.
      - name: Run prepare checks
        if: github.repository == 'duckdb/duckdb'
        timeout-minutes: 10
        run: |
          python3 scripts/ci/retry.py --timeout 2m -- make -j4 prepare_tools
          # the file list can exceed the size limit of an environment variable
          if [ -f .github/outputs/format_all_changed_files.txt ]; then
            cp .github/outputs/format_all_changed_files.txt "$RUNNER_TEMP/changed-format-files.txt"
          else
            : > "$RUNNER_TEMP/changed-format-files.txt"
          fi
          PYTHON=.cache/prepare-venv/bin/python \
            make test_ci generate-files extension-patch-check -j "$(nproc)" -Otarget
          PYTHON=.cache/prepare-venv/bin/python \
            FORMAT_FILES_FROM="$RUNNER_TEMP/changed-format-files.txt" \
            make format-check-files enum-integrity-check -j "$(nproc)" -Otarget
          echo "::group::Check generated files"
          git diff --exit-code
          echo "::endgroup::"

 linux-relassert:
    name: Linux Relassert (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # outrun (ARK-81): the tests run in the build job, in 3 shards plus the benchmark SQL, each
        # building warm from the shared ccache (one job id) instead of downloading the build (252 s).
        shard: ['1', '2', '3', 'bench']
    # This tests release build while enabling slow verifiers (masked by #ifdef DEBUG) and sanitizers
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-relassert') }}
    needs: prepare
    runs-on: outrun-linux-arm64
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_arm64_main }}
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
      TREAT_WARNINGS_AS_ERRORS: 1
      GEN: ninja
      CRASH_ON_ASSERT: 1
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      EXPORT_DYNAMIC_SYMBOLS: 1
      REDUCE_SYMBOLS: 1
      EXTENSION_STATIC_BUILD: 0

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        fetch_depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
        ref: ${{ needs.prepare.outputs.duckdb_commit }}
    - name: "outrun: start"
      id: start
      run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: "outrun: Bun"
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - name: "outrun: look relassert-${{ matrix.shard }} up"
      id: look
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        .github/outrun/run lookup "relassert-${{ matrix.shard }}"
    - uses: ./.github/actions/ccache-action
      if: steps.look.outputs.run == 'true'
      with:
        save: ${{ matrix.shard == '1' && fromJson(needs.prepare.outputs.save_cache) }}
    - name: Write changed tests file
      if: steps.look.outputs.run == 'true'
      shell: bash
      env:
        CHANGED_TESTS_FILES: ${{ needs.prepare.outputs.changed_tests_files }}
      run: printf '%s\n' "$CHANGED_TESTS_FILES" | sed '/^$/d' > "$RUNNER_TEMP/changed_tests.txt"
    - name: Build DuckDB
      if: steps.look.outputs.run == 'true'
      uses: duckdb/duckdb-ci/build-duckdb@main
      env:
        CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;parquet;autocomplete;httpfs"
        LINK_CORE_EXTENSIONS: 1
      with:
        build-type: relassert
        build: python3 scripts/ci/retry.py -- make relassert
        vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
        test: ${{ matrix.shard == '1' && 'make smoke T="--changed-tests=$RUNNER_TEMP/changed_tests.txt"' || '' }}
        save-cache: ${{ matrix.shard == '1' && fromJson(needs.prepare.outputs.save_cache) }}
    - name: Output version info
      if: steps.look.outputs.run == 'true'
      run: ./build/relassert/duckdb -c "PRAGMA version;"
    - name: Set DUCKDB_INSTALL_LIB for ADBC tests
      if: steps.look.outputs.run == 'true'
      run: echo "DUCKDB_INSTALL_LIB=$(find "$PWD" -name 'libduck*.so' | head -n 1)" >> "$GITHUB_ENV"
    - name: Test
      if: steps.look.outputs.run == 'true' && (matrix.shard != 'bench')
      run: |
        build/relassert/test/unittest --list-tests > "$RUNNER_TEMP/all.list" || true
        python3 .github/outrun/split.py "$RUNNER_TEMP/all.list" ${{ matrix.shard }} 3 > "$RUNNER_TEMP/shard.list"
        build/relassert/test/run --track-runtime=100 --test-list "$RUNNER_TEMP/shard.list"
    - name: Test Benchmark SQL
      if: steps.look.outputs.run == 'true' && (matrix.shard == 'bench')
      run: make test_benchmark_sql
    - name: "outrun: record relassert-${{ matrix.shard }}"
      if: success() && steps.look.outputs.run == 'true'
      shell: bash
      run: .github/outrun/run record "relassert-${{ matrix.shard }}" --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

 osx:
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'osx') }}
    uses: ./.github/workflows/OSX.yml
    secrets: inherit
    needs: prepare
    with:
      duckdb_version: ${{ needs.prepare.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.prepare.outputs.duckdb_commit }}
      is_release_build: ${{ fromJson(needs.prepare.outputs.is_release_build) }}
      runner_macos_arm64: outrun-macos
      skip_tests: ${{ fromJson(needs.prepare.outputs.skip_tests) }}
      run_all: ${{ github.event_name != 'workflow_dispatch' || inputs.run_all }}
      cache: ${{ inputs.cache || 'outrun' }}
